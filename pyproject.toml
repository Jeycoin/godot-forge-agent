[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "godot-forge-agent"
version = "1.1.0"
description = "A verifiable Godot game-prototyping agent built with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jieba>=0.42,<1",
    "langchain-openai>=0.3,<2",
    "langgraph>=0.6,<2",
    "langgraph-checkpoint-sqlite>=2.1,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "rank-bm25>=0.2.2,<1",
    "typer>=0.12,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.scripts]
godot-forge = "godot_forge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
